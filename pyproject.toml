[project]
name = "stock-research-multiagent"
version = "0.1.0"
description = "Multi-agent stock research MVP with auditable evidence chains."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "langgraph>=0.6.0",
    "pydantic-settings>=2.6.0",
    "pydantic>=2.10.0",
    "redis>=6.4.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
