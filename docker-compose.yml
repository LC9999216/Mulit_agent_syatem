services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_research
      REDIS_URL: redis://redis:6379/0
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL: https://financialmodelingprep.com/stable
      USE_DEMO_DATA: "false"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock_research
      REDIS_URL: redis://redis:6379/0
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      MARKET_DATA_BASE_URL: https://financialmodelingprep.com/stable
      USE_DEMO_DATA: "false"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_research
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
